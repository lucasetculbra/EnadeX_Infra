# Borda do EnadeX: roteia site e API na mesma origem, guarda em cache os GET da API, bloqueia rotas perigosas e
# limita a taxa por visitante. Fica atrás do Traefik da VPS (TLS, HTTP/2, compressão e HSTS), por isso aqui não há
# TLS nem gzip.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;
    keepalive_timeout 65s;

    log_format borda '$remote_addr "$request" $status $body_bytes_sent ${request_time}s '
                     'cache=$upstream_cache_status upstream=${upstream_response_time}s';
    access_log /dev/stdout borda;
    error_log  /dev/stderr warn;

    # DNS interno do Docker: api e web voltam a ser resolvidos quando um container é recriado (IP novo).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # IP real do visitante: o Traefik fala com a borda por uma rede Docker privada.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Cache dos GET da API em tmpfs (o compose monta /var/cache/nginx/api em memória; reiniciar a borda limpa tudo).
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:20m max_size=200m inactive=60m
                     use_temp_path=off;

    # Limites por IP. O limite vale antes do cache: por isso as rotas caras têm folga para recarregar a página.
    limit_req_zone $binary_remote_addr zone=api_geral:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_pesada:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=api_estabilidade:10m rate=10r/m;
    limit_req_status 429;

    # forcar=true nas descrições do EduCluster dispara chamada paga ao Gemini: bloqueado na borda.
    map $arg_forcar $forcar_ia {
        default             0;
        "~*^(1|true|sim)$"  1;
    }

    # O MultiENADE devolve erro como HTTP 200 com um JSON curto ({"erro": ...}). Respostas com menos de 200 bytes
    # não entram no cache, para que uma falha passageira do banco não fique guardada por 10 minutos.
    map $upstream_http_content_length $resposta_curta {
        default          0;
        "~^[0-9]{1,2}$"  1;
        "~^1[0-9]{2}$"   1;
    }

    upstream api {
        zone api 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    upstream web {
        zone web 64k;
        server web:3000 resolve;
        keepalive 16;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 64k;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # O @vercel/analytics só existe na Vercel; aqui responde vazio em vez de 404.
        location ^~ /_vercel/insights/ {
            access_log off;
            return 204;
        }

        # ---- Rotas bloqueadas para o público -------------------------------------------------------------
        # Retreinam modelos e truncam/regravam tabelas com a chave de serviço, sem autenticação.
        location ^~ /api/multienade/reprocessar/ {
            return 403;
        }
        # Recarga das 13 tabelas do E-XplainENADE (token próprio): só por dentro da VPS.
        location = /api/e-xplainenade/dataset/refresh {
            return 403;
        }

        # ---- Rotas caras -----------------------------------------------------------------------------------
        # OLS + VIF + SHAP e geração de PDF a cada chamada (POST, sem cache).
        location ~ ^/api/e-xplainenade/(hipotese|relatorio)$ {
            limit_req zone=api_pesada burst=3 nodelay;
            proxy_read_timeout 180s;
            proxy_pass http://api;
        }

        # Até 100 reamostragens de KMeans por chamada: cache longo e limite próprio.
        location = /api/educluster/cursos/clusters/estabilidade {
            limit_req zone=api_estabilidade burst=10 nodelay;
            proxy_cache api_cache;
            proxy_cache_key $request_uri;
            proxy_cache_valid 200 60m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 180s;
            proxy_cache_lock_age 180s;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            add_header X-Cache $upstream_cache_status always;
            proxy_read_timeout 180s;
            proxy_pass http://api;
        }

        # ---- Saúde: cache curto (o frontend consulta a cada 30 s por aba aberta) -------------------------------
        location ~ ^/api(/[a-z-]+)?/health$ {
            limit_req zone=api_geral burst=40 nodelay;
            proxy_cache api_cache;
            proxy_cache_key $request_uri;
            proxy_cache_valid 200 15s;
            proxy_cache_lock on;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            add_header X-Cache $upstream_cache_status always;
            proxy_read_timeout 30s;
            proxy_pass http://api;
        }

        # ---- MultiENADE: mesmo cache, sem guardar respostas curtas (erro com HTTP 200) -------------------------
        location ^~ /api/multienade/ {
            limit_req zone=api_geral burst=40 nodelay;
            proxy_cache api_cache;
            proxy_cache_key $request_uri;
            proxy_cache_valid 200 10m;
            proxy_no_cache $resposta_curta;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 120s;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            add_header X-Cache $upstream_cache_status always;
            proxy_read_timeout 120s;
            proxy_pass http://api;
        }

        # ---- Demais rotas da API: GET em cache por 10 min, servindo a cópia antiga enquanto atualiza ---------
        location /api/ {
            if ($forcar_ia) {
                return 403;
            }
            limit_req zone=api_geral burst=40 nodelay;
            proxy_cache api_cache;
            proxy_cache_key $request_uri;
            proxy_cache_valid 200 10m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 120s;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            add_header X-Cache $upstream_cache_status always;
            proxy_read_timeout 120s;
            proxy_pass http://api;
        }

        # ---- Documentação da API (Swagger) ------------------------------------------------------------------
        location = /docs         { proxy_pass http://api; }
        location = /redoc        { proxy_pass http://api; }
        location = /openapi.json { proxy_pass http://api; }

        # ---- Site -------------------------------------------------------------------------------------------
        location / {
            # api.enadex.org fora de /api leva para a documentação.
            if ($host = api.enadex.org) {
                return 302 /docs;
            }
            proxy_read_timeout 30s;
            proxy_pass http://web;
        }
    }
}

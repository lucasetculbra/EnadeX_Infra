# Faz a tag :main de uma imagem apontar para uma versão já publicada (rollback ou fixar versão), sem rebuild.
# A VPS sempre roda :main; depois deste workflow, "Atualizar" no Docker Manager (ou VPS_updateProjectV1) aplica a
# mudança sem tocar no .env do projeto. As versões disponíveis são as tags de 12 caracteres em
# https://github.com/orgs/EnadeX/packages.
name: Promover versão

on:
  workflow_dispatch:
    inputs:
      imagem:
        description: Imagem
        type: choice
        options: [enadex-api, enadex-web, enadex-edge]
      tag:
        description: Tag já publicada (sha de 12 caracteres) que passa a ser a :main
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: imagens-enadex
  cancel-in-progress: false

jobs:
  promover:
    runs-on: ubuntu-latest
    steps:
      - name: Validar a tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^[0-9a-f]{12}$ ]] || { echo "::error::A tag deve ser o sha de 12 caracteres publicado pelo CI."; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reapontar :main
        env:
          IMAGEM: ghcr.io/enadex/${{ inputs.imagem }}
          TAG: ${{ inputs.tag }}
        run: |
          docker buildx imagetools inspect "$IMAGEM:$TAG" > /dev/null
          echo "Antes:"; docker buildx imagetools inspect "$IMAGEM:main" | head -n 3
          docker buildx imagetools create --tag "$IMAGEM:main" "$IMAGEM:$TAG"
          echo "Depois:"; docker buildx imagetools inspect "$IMAGEM:main" | head -n 3
          echo "\`$IMAGEM:main\` agora aponta para \`$TAG\`. Falta aplicar na VPS: Atualizar o projeto enadex." >> "$GITHUB_STEP_SUMMARY"

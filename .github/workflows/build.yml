# Gera e publica as imagens do EnadeX no GHCR do dono deste repositório (ghcr.io/<dono>/enadex-*; o token do
# Actions só publica nesse espaço). Cada imagem só é publicada depois de passar no teste de fumaça.
name: Imagens do EnadeX

on:
  push:
    branches: [main]
    # Documentação e o compose da VPS não entram nas imagens: mudar só eles não gera build.
    paths-ignore: ['**.md', 'deploy/**']
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Branch, tag ou commit do EnadeX/EnadeX_Backend
        default: main
      frontend_ref:
        description: Branch, tag ou commit do EnadeX/EnadeX_Frontend
        default: master
  repository_dispatch:
    types: [backend-atualizado, frontend-atualizado]

permissions:
  contents: read
  packages: write

concurrency:
  group: imagens-enadex
  cancel-in-progress: false

env:
  SITE_URL: https://enadex.org

jobs:
  api:
    name: API (api_main.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Código do backend
        uses: actions/checkout@v4
        with:
          repository: EnadeX/EnadeX_Backend
          ref: ${{ github.event.inputs.backend_ref || 'main' }}
          persist-credentials: false
          path: backend

      - id: fonte
        run: |
          echo "sha=$(git -C backend rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "REGISTRO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build para teste
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          load: true
          tags: enadex-api:teste
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Teste de fumaça (os 4 módulos importam e /api/health responde, sem segredos)
        run: |
          docker run -d --name api -e WARMUP=0 -p 8000:8000 enadex-api:teste
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              echo; docker logs api 2>&1 | tail -n 20; exit 0
            fi
            sleep 2
          done
          docker logs api; exit 1

      - name: Versões resolvidas (lock)
        run: docker run --rm --entrypoint cat enadex-api:teste /opt/enadex/requirements.lock > requirements.lock

      - uses: actions/upload-artifact@v4
        with:
          name: api-requirements-lock
          path: requirements.lock

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRO }}/enadex-api:main
            ${{ env.REGISTRO }}/enadex-api:${{ steps.fonte.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.fonte.outputs.sha }}
            org.opencontainers.image.description=API do EnadeX (EnadeX_Backend ${{ steps.fonte.outputs.sha }})
          cache-from: type=gha,scope=api

      - run: echo "API publicada com a tag \`${{ steps.fonte.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Código do frontend (repositório público da organização, sem credencial)
        uses: actions/checkout@v4
        with:
          repository: EnadeX/EnadeX_Frontend
          ref: ${{ github.event.inputs.frontend_ref || 'master' }}
          persist-credentials: false
          path: frontend

      - id: fonte
        run: |
          echo "sha=$(git -C frontend rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "REGISTRO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build para teste
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          load: true
          tags: enadex-web:teste
          build-args: SITE_URL=${{ env.SITE_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Teste de fumaça (páginas, redirecionamento, 404 e URL de produção no bundle)
        run: |
          docker run -d --name web -p 3000:3000 enadex-web:teste
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          falhou=0
          while read -r esperado rota; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$rota" || true)
            echo "$codigo (esperado $esperado) $rota"
            [ "$codigo" = "$esperado" ] || falhou=1
          done <<'ROTAS'
          200 /
          200 /enade-time
          200 /enade-time/enade/anual
          200 /enade-time/spd/comparativo
          200 /enade-time/spd/etapas/1
          200 /multienade
          200 /e-xplainenade
          200 /educluster
          200 /educluster/cursos/1
          200 /repositorios
          307 /enade-time/spd
          404 /enade-time/rota-inexistente
          ROTAS
          [ "$falhou" = "0" ] || { docker logs web; exit 1; }
          docker exec web sh -c 'grep -rl "https://enadex.org" .next/static | head -n 1' | grep -q . \
            || { echo "URL de produção ausente do bundle"; exit 1; }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          build-args: SITE_URL=${{ env.SITE_URL }}
          tags: |
            ${{ env.REGISTRO }}/enadex-web:main
            ${{ env.REGISTRO }}/enadex-web:${{ steps.fonte.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.fonte.outputs.sha }}
            org.opencontainers.image.description=Frontend do EnadeX (EnadeX_Frontend ${{ steps.fonte.outputs.sha }})
          cache-from: type=gha,scope=web

      - run: echo "Frontend publicado com a tag \`${{ steps.fonte.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  edge:
    name: Borda (nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: fonte
        run: |
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "REGISTRO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build para teste
        uses: docker/build-push-action@v6
        with:
          context: .
          file: edge/Dockerfile
          load: true
          tags: enadex-edge:teste

      - name: Teste de fumaça (configuração do nginx válida)
        run: docker run --rm --add-host api:127.0.0.1 --add-host web:127.0.0.1 enadex-edge:teste nginx -t

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: edge/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRO }}/enadex-edge:main
            ${{ env.REGISTRO }}/enadex-edge:${{ steps.fonte.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.fonte.outputs.sha }}
            org.opencontainers.image.description=Borda nginx do EnadeX

      - run: echo "Borda publicada com a tag \`${{ steps.fonte.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
